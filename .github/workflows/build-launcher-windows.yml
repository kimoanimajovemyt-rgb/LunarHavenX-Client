name: Build and test LunarHavenX desktop launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LunarHavenX-1.0.0/**"
      - ".github/workflows/build-launcher-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Compile, test and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar e executar testes do núcleo
        working-directory: LunarHavenX-1.0.0
        shell: cmd
        run: scripts\build.bat

      - name: Verificar inicialização em modo versão
        working-directory: LunarHavenX-1.0.0
        shell: cmd
        run: java -jar dist\LunarHavenX-Launcher.jar --version

      - name: Empacotar aplicação portátil para Windows
        working-directory: LunarHavenX-1.0.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          jpackage --type app-image --input dist --main-jar LunarHavenX-Launcher.jar --main-class com.lunarhavenx.launcher.desktop.Main --name LunarHavenX --app-version 1.0.0 --icon .\launcher-desktop\src\main\resources\assets\icon.ico --dest portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar instalador EXE quando WiX estiver disponível
        working-directory: LunarHavenX-1.0.0
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          $light = Get-Command light.exe -ErrorAction SilentlyContinue
          if (-not $candle -or -not $light) {
            Write-Host "::warning::WiX não encontrado; o instalador EXE será omitido. A versão portátil continua sendo gerada."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          jpackage --type exe --input dist --main-jar LunarHavenX-Launcher.jar --main-class com.lunarhavenx.launcher.desktop.Main --name LunarHavenX --app-version 1.0.0 --vendor LunarHavenX --icon .\launcher-desktop\src\main\resources\assets\icon.ico --win-menu --win-shortcut --win-dir-chooser --dest release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Disponibilizar os artefatos para download
        uses: actions/upload-artifact@v4
        with:
          name: LunarHavenX-Launcher-Windows
          path: |
            LunarHavenX-1.0.0/portable/
            LunarHavenX-1.0.0/release/*.exe
          if-no-files-found: error
          retention-days: 14
